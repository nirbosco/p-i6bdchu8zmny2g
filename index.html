<title>עמוד מוגן</title>
<style>
:root{--bg:#F1F2EE;--card:#FBFBF8;--ink:#1C211E;--muted:#5C655E;--line:#D5D9D1;--accent:#B57A0C}
@media (prefers-color-scheme:dark){:root{--bg:#131614;--card:#1B1F1C;--ink:#E8ECE6;--muted:#9BA49C;--line:#2D332E;--accent:#E6B54C;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Arial,sans-serif;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:360px;display:grid;gap:12px;box-sizing:border-box}
h1{font-size:20px;margin:0}
p{margin:0;color:var(--muted);font-size:14px}
input{font:16px/1.4 inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);direction:ltr;text-align:center}
button{font:600 16px inherit;padding:10px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6}
#err{color:#B13A5D;min-height:1.2em;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body>

</form>
